[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "murn-ai"
version = "0.8.0"
description = "Local-first AI agent with memory, web research, Orbital browser control, inline image generation, image understanding, voice, desktop UI and mobile companion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
voice = [
  "piper-tts>=1.4,<2",
  "sounddevice>=0.5,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
murn-voice = "murn.voice_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/murn"]

[tool.ruff]
line-length = 100
