<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>murn.</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050505; color: #f5f5f5; }
    main { width: min(560px, calc(100vw - 48px)); padding: 32px; border: 1px solid #262626; background: #090909; }
    h1 { margin: 0 0 8px; font: 800 clamp(48px, 8vw, 88px)/.9 system-ui, sans-serif; letter-spacing: -.08em; }
    h1 span { color: #9c6cff; }
    p { color: #a8a8a8; line-height: 1.6; }
    code { color: #d5c0ff; }
    button { margin-top: 14px; padding: 12px 18px; border: 1px solid #8d62e8; background: #120d1b; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1a1128; }
  </style>
</head>
<body>
  <main>
    <h1>murn<span>.</span></h1>
    <p>The local backend did not answer on <code>127.0.0.1:7331</code>.</p>
    <p>Start <code>murn.service</code>, then reopen the app.</p>
    <button onclick="location.reload()">retry</button>
  </main>
</body>
</html>
